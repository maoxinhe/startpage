<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <title>起始页</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23a3e635'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 背景：Bing 每日一图（app.js 注入），加载前为纯色 #0e0e10 占位 -->
  <div class="bg" id="bg" aria-hidden="true"></div>
  <!-- 半透明遮罩：保证文字可读 -->
  <div class="veil" aria-hidden="true"></div>

  <main class="page">

    <!-- ===== 时钟（青柠起始页的视觉锚点） ===== -->
    <div class="clock" aria-label="当前时间">
      <div class="clock-time" id="clockTime">--:--</div>
      <div class="clock-date" id="clockDate"></div>
    </div>

    <!-- ===== 顶部搜索 ===== -->
    <section class="search-area">
      <form class="search-box" id="searchForm" role="search" autocomplete="off">
        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
          <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="searchInput" type="text" placeholder="搜点什么…"
               autocomplete="off" spellcheck="false" enterkeyhint="search" aria-label="搜索">
      </form>
      <!-- 引擎切换：app.js 生成，localStorage 记住选择 -->
      <nav class="engine-bar" id="engineBar" aria-label="切换搜索引擎"></nav>
    </section>

    <!-- ===== 导航卡片（app.js 按 nav.json 渲染，按 group 分区） ===== -->
    <section class="groups" id="groups" aria-label="导航"></section>

  </main>

  <script src="app.js"></script>
</body>
</html>
